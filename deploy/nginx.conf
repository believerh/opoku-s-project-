# Nginx alternative to Caddy for a VPS without Docker.
# Save as /etc/nginx/sites-available/okomfo-anokye, symlink into sites-enabled, then run:
#   sudo certbot --nginx -d YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Required: nginx's default limit (1 MB) would reject picture/video uploads with "413".
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
